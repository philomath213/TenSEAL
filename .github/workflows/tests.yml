name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CMAKE_VERSION: "3.31.11"

jobs:
  Linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: .github/workflows/scripts/install_req_ubuntu.sh
      - name: Lint with flake8
        run: .github/workflows/scripts/lint_python.sh
      - name: Lint with clang-format
        run: .github/workflows/scripts/lint_cpp.sh

  Build:
    needs: [Linter]
    runs-on: ${{ matrix.target[0] }}
    strategy:
      fail-fast: false
      matrix:
        # Build wheels on every supported version; tests run on the latest
        # only (see CIBW_TEST_SKIP below).
        target:
          - [ubuntu-24.04, manylinux_x86_64, ""]
          - [windows-2022, win_amd64, ""]
          - [macos-14, macosx_arm64, "14.0"]
        python:
          - cp311
          - cp312
          - cp313
          - cp314
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Check LongPathsEnabled
        run: |
          git config --system core.longpaths true
          (Get-ItemProperty "HKLM:System\CurrentControlSet\Control\FileSystem").LongPathsEnabled
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      # Pin the macOS toolchain to Xcode 15.4 (AppleClang 15). It is the current
      # macos-14 default, but pinning guards against a future image bump to
      # Xcode 16, which drops std::result_of and breaks the (old) xtensor build.
      - name: Select Xcode 15.4 (macOS)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        if: ${{ startsWith(matrix.target[0], 'macos') }}

      # Pin CMake so the (old) protobuf/json still configure; the runners'
      # default CMake 4.x rejects their cmake_minimum_required floors.
      - name: Install cmake ${{ env.CMAKE_VERSION }} (macOS)
        shell: bash
        run: |
          mkdir -p "$HOME/cmake-${{ env.CMAKE_VERSION }}"
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-macos-universal.tar.gz \
            | tar -xz -C "$HOME/cmake-${{ env.CMAKE_VERSION }}" --strip-components=1
          if [ -d "$HOME/cmake-${{ env.CMAKE_VERSION }}/CMake.app" ]; then
            echo "$HOME/cmake-${{ env.CMAKE_VERSION }}/CMake.app/Contents/bin" >> $GITHUB_PATH
          else
            echo "$HOME/cmake-${{ env.CMAKE_VERSION }}/bin" >> $GITHUB_PATH
          fi
        if: ${{ startsWith(matrix.target[0], 'macos') }}

      - name: Install cmake ${{ env.CMAKE_VERSION }} (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-windows-x86_64.zip" -OutFile "$env:TEMP\cmake.zip"
          Expand-Archive -Path "$env:TEMP\cmake.zip" -DestinationPath "$env:TEMP\cmake" -Force
          "$env:TEMP\cmake\cmake-${{ env.CMAKE_VERSION }}-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        if: ${{ startsWith(matrix.target[0], 'windows') }}

      - name: Build and test using cibuildwheel
        uses: pypa/cibuildwheel@298ed2fb2c105540f5ed055e8a6ad78d82dd3a7e # v3.3.1
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target[2] }}
          CIBW_BUILD: ${{ matrix.python }}-${{ matrix.target[1] }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: "curl -fsSL https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz | tar -xz -C /usr/local --strip-components=1"
          # Build every version; run the test suite on the latest Python only.
          CIBW_TEST_SKIP: "cp311-* cp312-* cp313-*"
          CIBW_TEST_REQUIRES: "numpy pytest scikit-image"
          CIBW_TEST_COMMAND: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi
          CIBW_TEST_COMMAND_LINUX: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi &&
            sh -c "cd {project} && cmake . -D BUILD_TEST=TRUE && make -j && CTEST_OUTPUT_ON_FAILURE=1 make test"
          CIBW_TEST_COMMAND_MACOS: >-
            pytest -m "not slow" -v {project}/tests/python/tenseal &&
            pytest -v {project}/tests/python/sealapi &&
            sh -c "cd {project} && cmake . -D BUILD_TEST=TRUE && make -j && CTEST_OUTPUT_ON_FAILURE=1 make test"
        with:
          package-dir: .
          output-dir: wheelhouse
