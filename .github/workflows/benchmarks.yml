name: Benchmarks
on:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, one platform failing cancels the others and hides their
      # real status - which is exactly what happened on the last run.
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # Pinned, matching the Tests workflow. The *-latest images now ship
        # CMake 4.x and AppleClang 21, neither of which the current
        # protobuf/json/xtensor pins can build against.
        os: [ubuntu-24.04, windows-2022, macos-14]

    env:
      # Lets the runner's CMake 4.x accept the pre-3.5 cmake_minimum_required in
      # protobuf 3.15.8 and nlohmann/json 3.9.1. Inherited by the nested cmake
      # invocation that setup.py spawns.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # MT vs MD: static vs dynamic runtime library linking. Protobuf enforces
      # /MT on its static .lib build, so everything linking it needs /MT too.
      # Carried over from the build_windows.bat this workflow used to call; it
      # is ignored by every non-MSVC compiler.
      _CL_: ${{ startsWith(matrix.os, 'windows') && '/MT' || '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Prepare ENV
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
      # Pin the macOS toolchain to Xcode 15.4 (AppleClang 15), the macos-14
      # default, so an image bump cannot reintroduce the std::result_of /
      # xtensor breakage that AppleClang 17+ triggers.
      - name: Select Xcode 15.4 (macOS)
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
        if: ${{ startsWith(matrix.os, 'macos') }}
      - name: Install the build toolchain (Ubuntu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git build-essential cmake automake libtool libtool-bin clang
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
      - name: Install dependencies Windows - msbuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        if: ${{ startsWith(matrix.os, 'windows') }}
      # cmake/protobuf.cmake runs `--target install` on Windows only, which drops
      # protoc under Program Files. Also carried over from build_windows.bat.
      - name: Put the installed protoc on PATH (Windows)
        shell: pwsh
        run: |
          "$env:ProgramFiles\protobuf\bin" >> $env:GITHUB_PATH
          "${env:ProgramFiles(x86)}\protobuf\bin" >> $env:GITHUB_PATH
        if: ${{ startsWith(matrix.os, 'windows') }}
      # One cross-platform step replaces install_req_{ubuntu,macos,windows} and
      # build_{nix,windows}: `uv sync` installs the dev group *and* the project,
      # so this both resolves dependencies and compiles the C++ extension.
      # `--frozen` installs exactly what uv.lock pins instead of re-resolving
      # from pyproject.toml, which is the whole point of committing the lock.
      # `--no-editable` builds and installs the project the way a user would.
      - name: Install dependencies and build the library
        run: uv sync --frozen --group dev --no-editable --python "${{ steps.python.outputs.python-path }}"
      - name: Run benchmarks
        run: |
          uv run --no-sync pytest tests/python/benchmarks/ --cov-fail-under 0 --benchmark-json pytest_benchmarks_output.json
      # Benchmark history is appended to the repository's gh-pages branch, which
      # forks do not get - a fork only receives the default branch - so this step
      # fails there with "couldn't find remote ref gh-pages" even when the build
      # and the benchmarks themselves succeeded. Skip it on forks by default; a
      # fork that wants to record its own history can create a gh-pages branch
      # and set the BENCHMARK_STORE repository variable to "true".
      - name: Store benchmark result
        if: ${{ !github.event.repository.fork || vars.BENCHMARK_STORE == 'true' }}
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
        with:
          name: Python-Benchmarks
          tool: "pytest"
          output-file-path: pytest_benchmarks_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: "benchmarks/${{ runner.os }}"
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
